<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#243247}body{margin:0;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{border:1px solid #d6deeb;border-radius:10px;padding:12px}.title{font-weight:650;font-size:14px;margin-bottom:8px}.small{font-size:12px;color:#64748b}label{display:flex;justify-content:space-between;margin-top:11px;font-size:12px}input{width:100%;accent-color:#3478b7}svg{width:100%;max-height:240px}button{background:#f2f5fa;border:1px solid #ccd5e2;border-radius:6px;padding:6px 10px;cursor:pointer;margin-top:9px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="grid"><div class="pane"><div class="title">Two-camera stereo geometry</div><div class="small">Parallel, rectified pinhole cameras. A 3D point's horizontal disparity is approximately <strong>d = f B / Z</strong>.</div>
<label for="baseline">Baseline B (m) <output id="vb">0.5</output></label><input id="baseline" type="range" min="0.1" max="1.5" step="0.1" value="0.5">
<label for="depth">Depth Z (m) <output id="vz">5</output></label><input id="depth" type="range" min="2" max="12" step=".5" value="5">
<label for="f">Focal length f (pixels) <output id="vf">600</output></label><input id="f" type="range" min="300" max="900" step="50" value="600"><button id="reset">Reset</button>
</div><div class="pane"><div class="title">Corresponding projections</div><svg viewBox="0 0 430 200" role="img" aria-label="Two rectified image lines showing parallax"><rect x="5" y="34" width="420" height="56" fill="#f4f8fd" stroke="#d6deeb"/><rect x="5" y="112" width="420" height="56" fill="#f4f8fd" stroke="#d6deeb"/><path d="M215 34 V90 M215 112 V168" stroke="#94a3b8" stroke-dasharray="5 4"/><circle id="a" cx="215" cy="62" r="6" fill="#3478b7"/><circle id="b" cx="195" cy="140" r="6" fill="#e19742"/><text x="12" y="23" font-size="12" fill="#243247">Left camera</text><text x="12" y="106" font-size="12" fill="#243247">Right camera</text></svg><div id="out" class="small"></div><div class="small">Real images may have rotation and non-rectified geometry; this demo isolates horizontal disparity.</div></div></div>
<script>let g=id=>document.getElementById(id);function draw(){let b=+g('baseline').value,z=+g('depth').value,f=+g('f').value,d=f*b/z;g('vb').textContent=b.toFixed(1);g('vz').textContent=z.toFixed(1);g('vf').textContent=f;g('a').setAttribute('cx',215+d/2);g('b').setAttribute('cx',215-d/2);g('out').textContent=`Disparity d = ${d.toFixed(1)} px. Greater baseline or smaller depth increases disparity.`};['baseline','depth','f'].forEach(id=>g(id).oninput=draw);g('reset').onclick=()=>{g('baseline').value=.5;g('depth').value=5;g('f').value=600;draw()};draw();</script></body></html>
