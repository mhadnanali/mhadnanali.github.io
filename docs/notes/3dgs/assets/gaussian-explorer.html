<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive 2D Gaussian Explorer</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#273348;background:#fff;}
*{box-sizing:border-box}body{margin:0;padding:14px;background:#fff;}
.explorer{max-width:760px;margin:0 auto;}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.head h2{font-size:16px;margin:0;font-weight:650}
.head span{font-size:12px;color:#607087}
canvas{width:100%;height:auto;display:block;border-radius:9px;border:1px solid #dee5ee;touch-action:pan-y;background:#f8fafc;}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;margin-top:12px}
.control label{font-size:12px;display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
.control output{font-variant-numeric:tabular-nums;font-weight:650;color:#9c621e}
.control input{width:100%;accent-color:#b97835;margin:3px 0 0;cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}
.foot p{font-size:11px;line-height:1.4;color:#63738a;margin:0}
button{border:1px solid #cdd6e1;border-radius:6px;background:#fff;padding:7px 10px;color:#253348;cursor:pointer;white-space:nowrap}
button:hover{background:#f1f4f7}
@media(max-width:520px){body{padding:9px}.grid{gap:9px}.head h2{font-size:14px}.foot p{font-size:10px}}
</style>
</head>
<body>
<div class="explorer">
  <div class="head"><h2>2D Gaussian cross-section</h2><span>Shape, orientation, and display opacity</span></div>
  <canvas id="plot" width="720" height="290" role="img" aria-label="Interactive heatmap of a 2D Gaussian and its equal-value ellipse"></canvas>
  <div class="grid">
    <div class="control"><label for="sx">Scale X <output id="sxValue">1.35</output></label><input id="sx" type="range" min="0.25" max="2.4" step="0.05" value="1.35"></div>
    <div class="control"><label for="sy">Scale Y <output id="syValue">0.55</output></label><input id="sy" type="range" min="0.25" max="2.4" step="0.05" value="0.55"></div>
    <div class="control"><label for="theta">Rotation <output id="thetaValue">30°</output></label><input id="theta" type="range" min="0" max="180" step="5" value="30"></div>
    <div class="control"><label for="alpha">Display opacity <output id="alphaValue">0.70</output></label><input id="alpha" type="range" min="0.10" max="1" step="0.05" value="0.7"></div>
  </div>
  <div class="foot"><p id="info">Center: (0,0). The dashed ellipse is the 1σ contour.<br>Opacity changes display intensity, not the Gaussian's spatial shape.</p><button type="button" id="reset">Reset</button></div>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('plot');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const ctrX = W / 2, ctrY = H / 2;
  const pxPerUnit = 54;
  const controls = Object.fromEntries(['sx','sy','theta','alpha'].map(id => [id, document.getElementById(id)]));
  const values = Object.fromEntries(['sx','sy','theta','alpha'].map(id => [id, document.getElementById(id + 'Value')]));
  const bg = [248,250,253], ink = [200,119,41];
  function parameters(){
    const sx = +controls.sx.value, sy = +controls.sy.value, theta = +controls.theta.value * Math.PI / 180;
    return {sx, sy, theta, alpha:+controls.alpha.value, c:Math.cos(theta), s:Math.sin(theta)};
  }
  function gaussian(x,y,p){
    // Rotate coordinates into the ellipse's principal-axis reference frame.
    const u = p.c*x + p.s*y, v = -p.s*x + p.c*y;
    return Math.exp(-0.5 * ((u*u)/(p.sx*p.sx) + (v*v)/(p.sy*p.sy)));
  }
  function draw(){
    const p = parameters();
    values.sx.textContent=p.sx.toFixed(2);
    values.sy.textContent=p.sy.toFixed(2);
    values.theta.textContent=Math.round(p.theta*180/Math.PI)+'°';
    values.alpha.textContent=p.alpha.toFixed(2);
    const frame=ctx.createImageData(W,H), data=frame.data;
    for(let py=0;py<H;py++){
      const y=(ctrY-py)/pxPerUnit;
      for(let px=0;px<W;px++){
        const x=(px-ctrX)/pxPerUnit;
        const g=gaussian(x,y,p), a=p.alpha*g;
        const i=(py*W+px)*4;
        for(let k=0;k<3;k++) data[i+k]=Math.round(bg[k]*(1-a)+ink[k]*a);
        data[i+3]=255;
      }
    }
    ctx.putImageData(frame,0,0);
    ctx.strokeStyle='rgba(65,85,113,.13)';ctx.lineWidth=1;
    for(let x=ctrX%pxPerUnit;x<W;x+=pxPerUnit){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=ctrY%pxPerUnit;y<H;y+=pxPerUnit){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.strokeStyle='rgba(65,85,113,.48)';
    ctx.beginPath();ctx.moveTo(ctrX,0);ctx.lineTo(ctrX,H);ctx.moveTo(0,ctrY);ctx.lineTo(W,ctrY);ctx.stroke();
    ctx.save();ctx.translate(ctrX,ctrY);ctx.rotate(-p.theta);
    ctx.setLineDash([7,5]);ctx.strokeStyle='#96591d';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,p.sx*pxPerUnit,p.sy*pxPerUnit,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    ctx.beginPath();ctx.arc(ctrX,ctrY,3.5,0,2*Math.PI);ctx.fillStyle='#7a4516';ctx.fill();
    ctx.fillStyle='#4e6077';ctx.font='13px system-ui, sans-serif';ctx.fillText('X',W-19,ctrY-9);ctx.fillText('Y',ctrX+10,17);
    ctx.fillText('μ = (0,0)',ctrX+10,ctrY+18);
  }
  Object.values(controls).forEach(el => el.addEventListener('input',draw));
  canvas.addEventListener('pointermove',e=>{
    const rect=canvas.getBoundingClientRect();
    const x=((e.clientX-rect.left)*W/rect.width-ctrX)/pxPerUnit;
    const y=(ctrY-(e.clientY-rect.top)*H/rect.height)/pxPerUnit;
    document.getElementById('info').innerHTML=`At (x=${x.toFixed(2)}, y=${y.toFixed(2)}), G(x,y)=${gaussian(x,y,parameters()).toFixed(3)}.<br>Opacity changes display intensity, not spatial shape.`;
  });
  canvas.addEventListener('pointerleave',()=>{
    document.getElementById('info').innerHTML='Center: (0,0). The dashed ellipse is the 1σ contour.<br>Opacity changes display intensity, not spatial shape.';
  });
  document.getElementById('reset').addEventListener('click',()=>{
    Object.entries({sx:'1.35',sy:'0.55',theta:'30',alpha:'0.7'}).forEach(([k,v])=>controls[k].value=v);
    draw();
  });
  draw();
})();
</script>
</body>
</html>
