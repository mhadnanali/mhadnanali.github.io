  <marker id="arrowteal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#087E86"/></marker>
  <marker id="arrowred" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#B35645"/></marker>
  <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E7F5F7"/><stop offset="0.48" stop-color="#88B2D2"/><stop offset="1" stop-color="#5A66AD"/></linearGradient>
