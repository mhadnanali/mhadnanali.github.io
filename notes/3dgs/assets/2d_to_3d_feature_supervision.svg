 </defs><title>2D-to-3D feature supervision</title><desc>Two correctly directed lanes: frozen SAM image teacher, trainable Gaussian renderer, feature loss and backprop to the Gaussian scene.</desc><rect x="0" y="0" width="1480" height="930" rx="0" fill="#F6F8FC" stroke="none" stroke-width="1" /><text x="72" y="53" fill="#087E86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.3">FEATURE 3DGS  /  TEACHING FIGURE 03</text><text x="72" y="105" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="750" text-anchor="start" >How fixed 2D SAM features supervise 3D Gaussians</text><text x="72" y="142" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >The teacher supplies targets; the renderer connects trainable Gaussian features to image coordinates.</text><path d="M72 163 H1408" stroke="#C9D6E6" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="70" y="193" width="1340" height="60" rx="13" fill="#EFF3FB" stroke="#C9D6E6" stroke-width="1" /><text x="100" y="230" fill="#365CB8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" text-anchor="start" letter-spacing="1">ONE TRAINING VIEW</text><text x="362" y="230" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Camera k: use the same image, camera parameters, and aligned feature locations on both branches.</text><rect x="71" y="278" width="855" height="224" rx="16" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1.3" /><rect x="71" y="523" width="855" height="224" rx="16" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1.3" /><rect x="88" y="296" width="117" height="30" rx="7" fill="#F3EFFF" stroke="none" stroke-width="1" /><text x="146.5" y="316" fill="#704BB8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750" text-anchor="middle" letter-spacing="0.8">TEACHER</text><rect x="88" y="541" width="117" height="30" rx="7" fill="#EAF8F6" stroke="none" stroke-width="1" /><text x="146.5" y="561" fill="#087E86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750" text-anchor="middle" letter-spacing="0.8">STUDENT</text><rect x="104" y="345" width="204" height="109" rx="12" fill="#EDF3FF" stroke="#365CB8" stroke-width="1.8" /><text x="206.0" y="389" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="middle" >Input image</text><text x="206.0" y="421" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" >RGB photo  Iₖ</text><rect x="357" y="345" width="205" height="109" rx="12" fill="#F3EFFF" stroke="#704BB8" stroke-width="1.8" /><text x="459.5" y="389" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="middle" >Frozen SAM</text><text x="459.5" y="421" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" >ViT-B image encoder</text><rect x="613" y="345" width="276" height="109" rx="12" fill="#F3EFFF" stroke="#704BB8" stroke-width="1.8" /><text x="751.0" y="389" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="middle" >Fixed 2D target</text><text x="751.0" y="421" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" >F_ref[k]: 256 × 48 × 64</text><rect x="104" y="590" width="204" height="109" rx="12" fill="#EAF8F6" stroke="#087E86" stroke-width="1.8" /><text x="206.0" y="634" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="middle" >3D Gaussians</text><text x="206.0" y="666" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" >trainable f_i: 256 values</text><rect x="357" y="590" width="205" height="109" rx="12" fill="#EAF8F6" stroke="#087E86" stroke-width="1.8" /><text x="459.5" y="634" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="middle" >Feature renderer</text><text x="459.5" y="666" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" >using camera k</text><rect x="613" y="590" width="276" height="109" rx="12" fill="#EAF8F6" stroke="#087E86" stroke-width="1.8" /><text x="751.0" y="634" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="middle" >Rendered 2D features</text><text x="751.0" y="666" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" >F_pred[k]: 256 × 48 × 64</text><path d="M308 399 H344" stroke="#70829A" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M562 399 H601" stroke="#70829A" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M308 644 H344" stroke="#70829A" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M562 644 H601" stroke="#70829A" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="991" y="404" width="350" height="206" rx="18" fill="#FFFAF2" stroke="#E5C89C" stroke-width="1.6" /><rect x="1012" y="425" width="111" height="29" rx="7" fill="#FFF6E8" stroke="none" stroke-width="1" /><text x="1068" y="445" fill="#B36A25" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750" text-anchor="middle" letter-spacing="0.8">COMPARE</text><text x="1012" y="491" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="750" text-anchor="start" >Feature loss</text><text x="1012" y="525" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >L = mean |F_pred − F_ref|</text><text x="1012" y="561" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >2D grid locations aligned</text><text x="1012" y="587" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >before comparison</text><path d="M889 398 H953 Q972 398 972 417 V468 H984" stroke="#704BB8" stroke-width="2.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M889 645 H953 Q972 645 972 627 V550 H984" stroke="#087E86" stroke-width="2.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowteal)"/><path d="M1165 610 V788 H208 V702" stroke="#B35645" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowred)"/><text x="831" y="775" fill="#A24535" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750" text-anchor="middle" >Backpropagate → update Gaussian parameters</text><text x="104" y="731" fill="#70829A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" >RGB + feature attributes learned</text><rect x="80" y="816" width="1309" height="52" rx="11" fill="#EDF3FF" stroke="none" stroke-width="1" /><text x="104" y="849" fill="#365CB8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750" text-anchor="start" >Training rule</text><text x="259" y="849" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="570" text-anchor="start" >SAM remains frozen. Only the 3DGS student is optimized against these targets.</text><path d="M72 855 H1408" stroke="#C9D6E6" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="75" y="887" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Teacher features are fixed for each training image; the example is a conceptual dataflow, not a network diagram.</text><text x="1406" y="887" fill="#70829A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end" >Conceptual illustration • Not measured SAM output</text></svg>