 </defs><title>Anatomy of SAM feature tensor</title><desc>A 256 × 48 × 64 tensor can be read as 256 channels of 48 × 64 maps, or as 256 features at one spatial location.</desc><rect x="0" y="0" width="1480" height="850" rx="0" fill="#F6F8FC" stroke="none" stroke-width="1" /><text x="72" y="53" fill="#087E86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.3">FEATURE 3DGS  /  TEACHING FIGURE 01</text><text x="72" y="105" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="750" text-anchor="start" >Anatomy of a SAM feature tensor</text><text x="72" y="142" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >One 3D tensor can be read as 256 spatial maps — or as a 256-D vector at a chosen location.</text><path d="M72 163 H1408" stroke="#C9D6E6" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="70" y="191" width="780" height="529" rx="18" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1.5" /><rect x="100" y="212" width="37" height="36" rx="8" fill="#EDF3FF" stroke="none" stroke-width="1" /><text x="118.5" y="235" fill="#365CB8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" >A</text><text x="151" y="234" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" >Channel-first view: 256 maps</text><text x="100" y="274" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Each channel is a 48 × 64 spatial field.</text><rect x="306" y="290" width="334" height="229" rx="2" fill="#A7C4E2" stroke="#85A3C9" stroke-width="1.2" /><rect x="287" y="306" width="334" height="229" rx="2" fill="#B4CEE5" stroke="#85A3C9" stroke-width="1.2" /><rect x="268" y="322" width="334" height="229" rx="2" fill