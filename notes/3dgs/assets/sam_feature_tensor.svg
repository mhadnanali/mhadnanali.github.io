troke-width="1" /><text x="926" y="330" fill="#704BB8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" >F[:, 20, 30]</text><text x="926" y="356" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >Collect all 256 channels at this location</text><text x="904" y="414" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" >One 256-D descriptor (illustrative values)</text><rect x="905" y="432" width="106" height="48" rx="8" fill="#EAF8F6" stroke="none" stroke-width="1" /><text x="958" y="461" fill="#087E86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" >+0.12</text><rect x="1021" y="432" width="106" height="48" rx="8" fill="#FFF6E8" stroke="none" stroke-width="1" /><text x="1074" y="461" fill="#B36A25" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" >-0.47</text><rect x="1137" y="432" width="106" height="48" rx="8" fill="#EAF8F6" stroke="none" stroke-width="1" /><text x="1190" y="461" fill="#087E86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" >+0.64</text><rect x="1253" y="432" width="106" height="48" rx="8" fill="#EAF8F6" stroke="none" stroke-width="1" /><text x="1306" y="461" fill="#087E86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" >+0.08</text><rect x="905" y="489" width="106" height="48" rx="8" fill="#FFF6E8" stroke="none" stroke-width="1" /><text x="958" y="518" fill="#B36A25" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" >-0.23</text><rect x="1021" y="489" width="106" height="48" rx="8" fill="#EAF8F6" stroke="none" stroke-width="1" /><text x="1074" y="518" fill="#087E86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" >+0.38</text><rect x="1137" y="489" width="106" height="48" rx="8" fill="#EAF8F6" stroke="none" stroke-width="1" /><text x="1190" y="518" fill="#087E86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" >+0.69</text><rect x="1253" y="489" width="106" height="48" rx="8" fill="#FFF6E8" stroke="none" stroke-width="1" /><text x="1306" y="518" fill="#B36A25" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" >-0.15</text><text x="1144" y="561" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" >… and 248 more values</text><rect x="903" y="599" width="471" height="91" rx="12" fill="#F8FAFD" stroke="#DCE6F2" stroke-width="1" /><text x="922" y="630" fill="#172B4D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" text-anchor="start" >Important:</text><text x="922" y="655" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >A 256-D vector is a descriptor,</text><text x="922" y="677" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >not an RGB color or a class label.</text><path d="M72 775 H1408" stroke="#C9D6E6" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="75" y="807" fill="#50617A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Indexing convention: F[channel, row, column]; the illustrated values are synthetic.</text><text x="1406" y="807" fill="#70829A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end" >Conceptual illustration • Not measured SAM output</text></svg>