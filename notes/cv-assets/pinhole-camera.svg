<text x="31" y="255" font-size="14">Camera center</text>
<text x="249" y="70" font-size="14">Virtual image plane</text>
<text x="582" y="75" font-size="14" font-weight="600">3D point</text>
<text x="582" y="93" font-size="14">(X, Z)</text>
