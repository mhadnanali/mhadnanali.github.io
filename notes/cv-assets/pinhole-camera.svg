<rect x="1" y="1" width="698" height="288" rx="10" fill="#fafbfd" stroke="#d8e0e8"/>
<text x="28" y="30" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#253549">Perspective projection (side view; virtual image plane)</text>
<path d="M92 229H630" stroke="#b9c4ce" stroke-width="2" marker-end="url(#az)"/>
<text x="637" y="235" font-family="Arial,sans-serif" font-size="15" fill="#255a80">Z</text>
<path d="M92 229V50" stroke="#b9c4ce" stroke-width="2" marker-end="url(#az)"/>
<text x="83" y="43" font-family="Arial,sans-serif" font-size="15" fill="#255a80">X</text>
